name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - name: Validate dictionaries are valid JSON
        run: for f in src/kawallm/safety/words/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core tests (no optional deps)
        run: |
          uv venv --clear && uv pip install -e ".[dev]"
          uv run pytest
      - name: Integration tests (LiteLLM + Presidio)
        if: matrix.python == '3.12'
        run: |
          uv pip install -e ".[dev,litellm,presidio]"
          uv run pytest --cov --cov-fail-under=90

  breach-evals:
    # Offline regression suite for leak patterns found in review (synthetic data, no API keys).
    # Kept outside the default testpaths; a missing dependency is an error, never a skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --clear && uv pip install -e ".[dev,litellm]"
      - run: uv run pytest evals/breaches -p no:cacheprovider

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --clear && uv pip install -e . && uv run python benchmarks/bench_latency.py --iterations 1000 --json | tee bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: bench.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t kawallm-litellm:ci .

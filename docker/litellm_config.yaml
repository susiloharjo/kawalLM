model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  # Contoh model lokal (vLLM / Ollama OpenAI-compatible):
  # - model_name: local-llm
  #   litellm_params:
  #     model: openai/qwen2.5-7b-instruct
  #     api_base: http://vllm:8000/v1
  #     api_key: dummy

guardrails:
  - guardrail_name: kawallm
    litellm_params:
      guardrail: kawallm.integrations.litellm.KawalLMGuardrail
      mode: [pre_call, post_call]
      default_on: true
      mask_pii: true
      block_violations: true
      masking_mode: reversible        # token | redact | partial | reversible
      restore_output: true            # kembalikan nilai asli di respons (reversible saja)
      mask_output: true               # masking PII baru yang dihasilkan model
      scan_roles: user                # role yang dicek safety (system prompt tidak)
      block_categories: JUDOL_PINJOL,SARA_HATE_SPEECH,JAILBREAK
      block_status_code: 400

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

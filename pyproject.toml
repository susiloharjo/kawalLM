[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kawallm"
dynamic = ["version"]
description = "Low-latency guardrail engine for Indonesian PII (UU PDP) masking and content safety, drop-in for LiteLLM Proxy."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "KawalLM contributors" }]
keywords = ["guardrail", "pii", "uu-pdp", "indonesia", "litellm", "presidio", "llm", "nik", "npwp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Indonesian",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["pyahocorasick>=2.0"]

[project.optional-dependencies]
litellm = ["litellm>=1.60", "fastapi>=0.100"]
presidio = ["presidio-analyzer>=2.2"]
fastapi = ["fastapi>=0.100"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.23", "ruff>=0.6", "httpx>=0.27", "fastapi>=0.100"]

[project.scripts]
kawallm = "kawallm.__main__:main"

[project.urls]
Homepage = "https://github.com/susiloharjo/kawalLM"
Issues = "https://github.com/susiloharjo/kawalLM/issues"

[tool.hatch.version]
path = "src/kawallm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kawallm"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["kawallm"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
